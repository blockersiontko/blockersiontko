name: Update username

on:
  push:
    paths:
      - "scripts/username.bf"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Generate username.md
        run: |
          mkdir -p profile
          python3 scripts/interpreters/brainfuck_int.py scripts/username.bf > profile/username.md

      - name: Update README.md
        run: |
          python scripts/username_brainfuck.py

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md profile/username.md
          git diff --staged --quiet || git commit -m "chore: update username"
          git push
