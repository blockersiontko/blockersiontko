name: Update header
on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache EmojiCode
        id: cache-emojicode
        uses: actions/cache@v4
        with:
          path: /usr/local/emojicode
          key: emojicode-v1.0-beta.2-${{ runner.os }}

      - name: Install Emojicode prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          # Install modern ncurses and common utilities; libncurses6 + libtinfo6 provide compatibility on Ubuntu 24.04
          sudo apt-get install -y --no-install-recommends rsync wget tar ca-certificates libncurses6 libtinfo6

      - name: Download and install Emojicode
        run: |
          set -euo pipefail
          wget https://github.com/emojicode/emojicode/releases/download/v1.0-beta.2/Emojicode-1.0-beta.2-Linux-x86_64.tar.gz
          tar -xzf Emojicode-1.0-beta.2-Linux-x86_64.tar.gz
          cd Emojicode-1.0-beta.2-Linux-x86_64
          sudo ./install.sh

      - name: Add EmojiCode to PATH
        run: |
          # Make sure both potential install locations are on PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/usr/local/emojicode/bin" >> $GITHUB_PATH
          echo "/usr/local/emojicode" >> $GITHUB_PATH
          echo "GITHUB_PATH contents:"
          cat $GITHUB_PATH

      - name: Compile and run EmojiCode script
        run: |
          set -euo pipefail
          mkdir -p profile
          # sanity check where emojicodec is
          echo "Which emojicodec (if any):"
          which emojicodec || true
          emojicodec --version || true
          # If emojicodec is not found at $PATH, try absolute path where installer typically places it
          if ! command -v emojicodec >/dev/null 2>&1; then
            if [ -x /usr/local/emojicode/bin/emojicodec ]; then
              /usr/local/emojicode/bin/emojicodec scripts/header.🍇 -o profile/header_bin
            elif [ -x /usr/local/bin/emojicodec ]; then
              /usr/local/bin/emojicodec scripts/header.🍇 -o profile/header_bin
            else
              echo "emojicodec not found; listing /usr/local:"
              ls -la /usr/local || true
              exit 1
            fi
          else
            emojicodec scripts/header.🍇 -o profile/header_bin
          fi
          ./profile/header_bin > profile/header.md

      - name: Update README
        run: |
          set -euo pipefail
          python3 << 'EOF'
          from pathlib import Path
          header = Path("profile/header.md").read_text().strip()
          readme = Path("README.md").read_text()
          start = "<!-- HEADER:START -->"
          end = "<!-- HEADER:END -->"
          before = readme.split(start)[0]
          after = readme.split(end)[1]
          new = before + start + "\n" + header + "\n" + end + after
          Path("README.md").write_text(new)
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md profile/header.md
          git diff --cached --quiet || git commit -m "Update README header"
          git push
