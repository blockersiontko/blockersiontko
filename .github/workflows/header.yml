name: Update header
on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            unzip \
            git \
            libtinfo5 \
            libncurses5

      - name: Setup Emojicode
        uses: cjdenio/setup-emojicode@v1.1
        with:
          version: "1.0-beta.2"

      - name: Compile
        run: |
          emojicodec scripts/header.🍇 -o profile/header_bin
          ./profile/header_bin > profile/header.md
