name: Update header
on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache EmojiCode
        id: cache-emojicode
        uses: actions/cache@v4
        with:
          # cache under the runner user's home so restore doesn't require sudo
          path: $HOME/.emojicode
          key: emojicode-v1.0-beta.2-${{ runner.os }}

      - name: Install Emojicode prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync wget tar ca-certificates libncurses6 libtinfo6

      - name: Download and install Emojicode
        run: |
          set -euo pipefail
          # download and extract to a temp dir
          wget -O emojicode.tar.gz https://github.com/emojicode/emojicode/releases/download/v1.0-beta.2/Emojicode-1.0-beta.2-Linux-x86_64.tar.gz
          mkdir -p emojicode_tmp
          tar -xzf emojicode.tar.gz -C emojicode_tmp --strip-components=1

          # copy into /usr/local/emojicode and put the CLI into /usr/local/bin
          sudo mkdir -p /usr/local/emojicode
          sudo cp -r emojicode_tmp/* /usr/local/emojicode/
          if [ -d /usr/local/emojicode/bin ]; then
            sudo cp -r /usr/local/emojicode/bin/* /usr/local/bin/ || true
            sudo chmod +x /usr/local/bin/emojicodec || true
          fi

          # also copy into HOME for caching (no sudo required)
          mkdir -p $HOME/.emojicode
          cp -r /usr/local/emojicode/* $HOME/.emojicode/ || true

          # debug output so we can see what's present
          echo "ls -la /usr/local:"
          ls -la /usr/local || true
          echo "ls -la /usr/local/emojicode:"
          ls -la /usr/local/emojicode || true
          echo "ls -la /usr/local/bin/emojicodec:"
          ls -la /usr/local/bin/emojicodec || true
          echo "Which emojicodec (PATH):"
          which emojicodec || true
          emojicodec --version || true

      - name: Add EmojiCode to PATH
        run: |
          # Ensure local install locations are on PATH for subsequent steps
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/usr/local/emojicode/bin" >> $GITHUB_PATH
          echo "$HOME/.emojicode/bin" >> $GITHUB_PATH || true
          echo "GITHUB_PATH contents:"
          cat $GITHUB_PATH

      - name: Compile and run EmojiCode script
        run: |
          set -euo pipefail
          mkdir -p profile
          echo "Which emojicodec (if any):"
          which emojicodec || true
          emojicodec --version || true

          # Try PATH first, then fallback to common absolute locations
          if command -v emojicodec >/dev/null 2>&1; then
            emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x /usr/local/emojicode/bin/emojicodec ]; then
            /usr/local/emojicode/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x $HOME/.emojicode/bin/emojicodec ]; then
            $HOME/.emojicode/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x /usr/local/bin/emojicodec ]; then
            /usr/local/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          else
            echo "emojicodec not found; listing /usr/local and home:"
            ls -la /usr/local || true
            ls -la $HOME || true
            exit 1
          fi

          ./profile/header_bin > profile/header.md
