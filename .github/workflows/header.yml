name: Update header
on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache EmojiCode
        id: cache-emojicode
        uses: actions/cache@v4
        with:
          path: /usr/local/emojicode
          key: emojicode-v1.0-beta.2-linux

      - name: Install EmojiCode (from prebuilt binaries)
        if: steps.cache-emojicode.outputs.cache-hit != 'true'
        run: |
          VERSION="v1.0-beta.2"
          ARCHIVE="Emojicode-${VERSION}-Linux-x86_64.tar.gz"
          wget -q "https://github.com/emojicode/emojicode/releases/download/${VERSION}/${ARCHIVE}"
          tar -xzf "${ARCHIVE}"
          cd "Emojicode-${VERSION}-Linux-x86_64"
          sudo ./install.sh --yes

      - name: Add EmojiCode to PATH
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Compile and run EmojiCode script
        run: |
          mkdir -p profile
          # Kompiluje .🍇 do binarki
          emojicodec scripts/header.🍇 -o profile/header_bin
          # Uruchamia skompilowaną binarkę i zapisuje output
          ./profile/header_bin > profile/header.md

      - name: Update README
        run: |
          python3 << 'EOF'
          from pathlib import Path
          header = Path("profile/header.md").read_text().strip()
          readme = Path("README.md").read_text()
          start = "<!-- HEADER:START -->"
          end = "<!-- HEADER:END -->"
          before = readme.split(start)[0]
          after = readme.split(end)[1]
          new = before + start + "\n" + header + "\n" + end + after
          Path("README.md").write_text(new)
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md profile/header.md
          git diff --cached --quiet || git commit -m "Update README header"
          git push
