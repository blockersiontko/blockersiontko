name: Update header
on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtinfo5 libncurses5 libncursesw5 ca-certificates curl wget unzip

          # Fallback: if libtinfo.so.5 isn't available in the distro packages,
          # try creating a compat symlink from libtinfo.so.6 (last resort).
          if ! ldconfig -p | grep -q libtinfo.so.5; then
            echo "libtinfo.so.5 not found; attempting compat symlink from libtinfo.so.6"
            if ldconfig -p | grep -q libtinfo.so.6; then
              realpath="$(ldconfig -p | awk '/libtinfo.so.6/ {print $4; exit}')"
              sudo ln -sf "$realpath" /usr/lib/libtinfo.so.5 || true
            else
              echo "libtinfo.so.6 not found either; please check available ncurses packages."
            fi
          fi

          # Quick verification (if emojicodec is already present this will show resolved libs)
          if command -v emojicodec >/dev/null 2>&1; then
            echo "emojicodec found at: $(command -v emojicodec)"
            ldd "$(command -v emojicodec)" | grep libtinfo || true
            emojicodec --version || true
          fi
      
      - name: Setup Emojicode
        uses: cjdenio/setup-emojicode@v1.1
        with:
            version: "1.0-beta.2" # optional — defaults to 1.0-beta.2 if omitted

      - name: Compile and run EmojiCode script
        run: |
          set -euo pipefail
          mkdir -p profile
          echo "Which emojicodec (if any):"
          which emojicodec || true
          emojicodec --version || true

          # Try PATH first, then fallback to common absolute locations
          if command -v emojicodec >/dev/null 2>&1; then
            emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x /usr/local/emojicode/bin/emojicodec ]; then
            /usr/local/emojicode/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x $HOME/.emojicode/bin/emojicodec ]; then
            $HOME/.emojicode/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          elif [ -x /usr/local/bin/emojicodec ]; then
            /usr/local/bin/emojicodec scripts/header.🍇 -o profile/header_bin
          else
            echo "emojicodec not found; listing /usr/local and home:"
            ls -la /usr/local || true
            ls -la $HOME || true
            exit 1
          fi

          ./profile/header_bin > profile/header.md
