name: Update header

on:
  push:
    paths:
      - "scripts/header.🍇"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System diagnostics
        run: |
          set -euxo pipefail

          echo "=== OS ==="
          cat /etc/os-release

          echo "=== Kernel ==="
          uname -a

          echo "=== Architecture ==="
          uname -m

          echo "=== Existing tinfo/ncurses libs ==="
          ldconfig -p | grep -E "tinfo|ncurses" || true

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            libtinfo5 \
            libncurses5 \
            file \
            binutils \
            xxd

          echo "=== Installed packages ==="
          dpkg -l | grep -E "ncurses|tinfo" || true

      - name: Install Emojicode
        run: |
          set -euxo pipefail

          echo "=== Download Emojicode ==="

          curl -L \
            -o emojicode.tar.gz \
            "https://github.com/emojicode/emojicode/releases/download/v1.0-beta.2/Emojicode-1.0-beta.2-Linux-x86_64.tar.gz"

          ls -lh emojicode.tar.gz

          echo "=== Extract ==="
          tar -xzf emojicode.tar.gz

          EMOJI_DIR="Emojicode-1.0-beta.2-Linux-x86_64"

          echo "=== Extracted files ==="
          ls -la "$EMOJI_DIR"

          echo "=== Install compiler and packages ==="

          sudo mkdir -p /usr/local/include/emojicode
          sudo mkdir -p /usr/local/EmojicodePackages

          sudo cp "$EMOJI_DIR/emojicodec" \
            /usr/local/bin/emojicodec

          sudo cp -r "$EMOJI_DIR/include/"* \
            /usr/local/include/emojicode/

          sudo cp -r "$EMOJI_DIR/packages/"* \
            /usr/local/EmojicodePackages/

          sudo chmod +x /usr/local/bin/emojicodec

          echo "=== Emojicode location ==="
          which emojicodec

          echo "=== Installed packages ==="
          ls -la /usr/local/EmojicodePackages

          echo "=== Check package s ==="
          ls -la /usr/local/EmojicodePackages/s

          echo "=== Binary info ==="
          file /usr/local/bin/emojicodec

          echo "=== Linked libraries ==="
          ldd /usr/local/bin/emojicodec || true

          echo "=== Version ==="
          emojicodec --version || true

      - name: Debug source bytes
        run: |
          set -euxo pipefail

          echo "=== cat ==="
          cat scripts/header.🍇

          echo

          echo "=== hex ==="
          xxd scripts/header.🍇

      - name: Compile header
        run: |
          set -euxo pipefail

          echo "=== Input file ==="
          ls -lh scripts/header.🍇

          mkdir -p profile

          echo "=== Compile ==="
          emojicodec scripts/header.🍇 -o profile/header_bin

          echo "=== Generated binary ==="
          file profile/header_bin
          ls -lh profile/header_bin

          echo "=== Run generated program ==="
          ./profile/header_bin | tee profile/header.md

          echo "=== Generated markdown ==="
          cat profile/header.md

      - name: Update README header section
        run: |
          set -euxo pipefail

          echo "=== Updating README.md ==="

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          header = Path("profile/header.md")

          start_marker = "<!-- HEADER:START -->"
          end_marker = "<!-- HEADER:END -->"

          if not readme.exists():
              raise SystemExit("README.md not found")

          readme_text = readme.read_text(encoding="utf-8")
          header_text = header.read_text(encoding="utf-8").strip()
          header_text = f"**{header_text}**"

          if start_marker not in readme_text:
              raise SystemExit(
                  "Missing <!-- HEADER:START --> in README.md"
              )

          if end_marker not in readme_text:
              raise SystemExit(
                  "Missing <!-- HEADER:END --> in README.md"
              )

          before, rest = readme_text.split(start_marker, 1)
          _, after = rest.split(end_marker, 1)

          new_readme = (
              before
              + start_marker
              + "\n\n"
              + header_text
              + "\n\n"
              + end_marker
              + after
          )

          readme.write_text(new_readme, encoding="utf-8")

          print("README.md updated successfully")
          PY

          echo "=== Updated README section ==="
          sed -n '/HEADER:START/,/HEADER:END/p' README.md

      - name: Commit generated header
        run: |
          set -euxo pipefail

          echo "=== Git status ==="
          git status

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/header.md

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          echo "=== Commit ==="
          git commit -m "Update header"

          echo "=== Push ==="
          git push
